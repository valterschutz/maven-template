_min_copier_version: 9.10.3
_subdirectory: template
_answers_file: maven-template-answers.yml

project_name:
  type: str
  help: What is your project name? You can include spaces.

group_id:
  type: str
  help: What is your group ID? Use reverse domain notation, e.g. org.codehaus.mojo. Dots are allowed; dashes and underscores are not.

artifact_id:
  type: str
  help: What is your artifact ID? Use dashes, e.g. exec-maven-plugin. Your base package will be <group_id>.<artifact_id> with dashes replaced by underscores.

main_class:
  type: str
  help: What is your main class called?
  default: Main

java_version:
  type: int
  help: Which java version do you want to use?
  default: 21
